<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07090d"/>
    <stop offset=".52" stop-color="#111827"/>
    <stop offset="1" stop-color="#05060a"/>
  </linearGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a78bfa"/>
    <stop offset=".5" stop-color="#ffffff"/>
    <stop offset="1" stop-color="#67e8f9"/>
  </linearGradient>
  <radialGradient id="orb">
    <stop offset="0" stop-color="#a78bfa" stop-opacity=".32"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
  <style>
    .pulse { animation: pulse 4s ease-in-out infinite; transform-origin:center; }
    .float { animation: float 6s ease-in-out infinite; }
    .float2 { animation: float 8s ease-in-out infinite reverse; }
    .dash { animation: dash 10s linear infinite; }
    @keyframes pulse { 0%,100%{opacity:.35;transform:scale(1)} 50%{opacity:.7;transform:scale(1.12)} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    @keyframes dash { to { stroke-dashoffset:-400; } }
  </style>
</defs>

<rect width="1200" height="430" rx="28" fill="url(#bg)"/>
<circle class="pulse" cx="1040" cy="80" r="190" fill="url(#orb)" filter="url(#blur)"/>
<circle class="pulse" cx="180" cy="350" r="160" fill="url(#orb)" filter="url(#blur)"/>

<g opacity=".13" stroke="#ffffff">
  <path d="M0 90H1200M0 170H1200M0 250H1200M0 330H1200"/>
  <path d="M120 0V430M240 0V430M360 0V430M840 0V430M960 0V430M1080 0V430"/>
</g>

<g class="float" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity=".75">
  <circle cx="1000" cy="215" r="92"/>
  <circle cx="1000" cy="215" r="125" opacity=".35"/>
  <circle cx="1000" cy="215" r="158" opacity=".18"/>
</g>

<g class="float2" fill="#ffffff">
  <circle cx="1000" cy="123" r="3"/>
  <circle cx="1125" cy="215" r="3"/>
  <circle cx="1000" cy="373" r="3"/>
  <circle cx="842" cy="215" r="3"/>
</g>

<g transform="translate(78 92)">
  <text x="0" y="0" fill="#a1a1aa" font-family="Arial,Helvetica,sans-serif" font-size="16" letter-spacing="5">SOFTWARE • AI • CLOUD</text>
  <text x="0" y="76" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700">SYED ROSHAN RIYAN</text>
  <text x="2" y="118" fill="url(#glow)" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600">AI Engineer · Developer · Builder</text>
  <text x="2" y="166" fill="#d4d4d8" font-family="Arial,Helvetica,sans-serif" font-size="16">Building digital products from idea → architecture → deployment.</text>
</g>

<g transform="translate(80 330)">
  <rect width="116" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="58" y="22" text-anchor="middle" fill="#e4e4e7" font-family="Arial,Helvetica,sans-serif" font-size="13">AI SYSTEMS</text>
  <rect x="128" width="130" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="193" y="22" text-anchor="middle" fill="#e4e4e7" font-family="Arial,Helvetica,sans-serif" font-size="13">FULL STACK</text>
  <rect x="270" width="100" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="320" y="22" text-anchor="middle" fill="#e4e4e7" font-family="Arial,Helvetica,sans-serif" font-size="13">CLOUD</text>
</g>

<path class="dash" d="M80 395H1120" stroke="url(#glow)" stroke-width="1" stroke-dasharray="8 12" opacity=".6"/>
</svg>